<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Design to Cost Supply Chain Management monthly demand and supply planning." />
    <title>Design to Cost | Supply Chain Management</title>
    <link rel="icon" type="image/png" href="/static/logo.png" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <section id="authView" class="auth-view" hidden></section>
    <div id="appShell" class="app-shell" hidden>
      <main class="main-content">
        <header class="topbar">
          <div class="masthead">
            <a class="brand" href="#" data-page="dashboard">
              <img src="/static/logo.png" alt="Design to Cost logo" />
              <span><strong>Design to Cost</strong><small>SUPPLY CHAIN MANAGEMENT</small></span>
            </a>
            <div class="topbar-actions">
              <span class="user-chip"><span class="status-pulse"></span><span><strong id="userRole">Workspace online</strong><small id="userName">Local data · SQLite</small></span></span>
              <span class="date-chip"><span data-icon="calendar"></span><span id="todayLabel"></span></span>
              <button class="icon-button" id="refreshButton" aria-label="Refresh workspace" title="Refresh"><span data-icon="refresh"></span></button>
              <button class="button button-small" id="logoutButton">Sign out</button>
            </div>
          </div>
          <nav class="main-nav" aria-label="Main navigation">
            <button class="nav-link active" data-page="dashboard">Dashboard</button>
            <button class="nav-link" data-page="plans">Plans &amp; actuals</button>
            <button class="nav-link" data-page="master">Product Master</button>
            <button class="nav-link" data-page="suppliers">Suppliers</button>
            <button class="nav-link" data-page="purchase-orders">PO schedule</button>
            <button class="nav-link" data-page="reports">Shortage &amp; excess</button>
            <button class="nav-link" data-page="business">Supplier business</button>
            <button class="nav-link" data-page="users" id="usersNav" hidden>Users</button>
          </nav>
        </header>
        <div id="pageContent" class="page-content" aria-live="polite">
          <div class="loading-state"><span class="spinner"></span>Loading your workspace…</div>
        </div>
      </main>
    </div>
    <div id="modalLayer" class="modal-layer" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <header class="modal-header">
          <div><p class="eyebrow" id="modalEyebrow">SUPPLY CHAIN MANAGEMENT</p><h2 id="modalTitle">New record</h2></div>
          <button class="icon-button" data-close-modal aria-label="Close dialog"><span data-icon="close"></span></button>
        </header>
        <div id="modalBody" class="modal-body"></div>
      </section>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script src="/static/app.js" defer></script>
  </body>
</html>
